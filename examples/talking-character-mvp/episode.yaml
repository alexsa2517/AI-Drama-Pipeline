    music_direction: "ADAPTIVE: เริ่มด้วยความเงียบและเสียงบรรยากาศกระท่อม เมื่อ Baba Yaga พูดให้มีดนตรีต่ำมากได้เฉพาะถ้าช่วยเพิ่มความกดดัน ก่อนประโยค 'อย่าหันกลับไป' ให้ลดหรือหยุดดนตรีเพื่อเน้นเสียงพูดและความเงียบ หลังประโยคสุดท้ายสามารถจบด้วย silence และ cut to black"
