    title: "กระท่อมกลางป่า"
    location: "กระท่อมของ Baba Yaga กลางป่าลึก"
    time: "กลางคืน ฝนเพิ่งหยุด พื้นไม้และหน้าต่างมีหยดน้ำ"
    action: "Elena ยืนอยู่ด้านในกระท่อมตรงข้าม Baba Yaga โดยมีโต๊ะไม้เก่าอยู่ระหว่างทั้งสอง"
    duration_seconds: 24
    environment_lock: "ABSOLUTE: กระท่อมของ Baba Yaga เดิมตลอดทั้งฉาก ห้ามเปลี่ยนเป็นบ้าน ถนน ป่า ห้องอื่น โกดัง หรือสถานที่อื่น ห้ามเปลี่ยนตำแหน่งโต๊ะ เตาผิง ประตู หน้าต่าง ผนังไม้ หรือแสงเทียน กล้องเปลี่ยนมุมได้เฉพาะเพื่อถ่ายพื้นที่จริงเดิม"
    visual_anchor: "กระท่อมไม้เก่าเพดานต่ำ โต๊ะไม้เก่าตรงกลาง เตาผิงหินด้านซ้าย หน้าต่างไม้ด้านหลังขวา ประตูทางเข้าอยู่ด้านหลัง Elena เทียนสามเล่มบนโต๊ะ แสงส้มจากเตาผิงตัดกับแสงน้ำเงินเย็นจากหน้าต่าง"
    dialogue_lines:
